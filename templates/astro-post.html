<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ title }} - n3rdium's astrophotography</title>
    {{ head }}

    <meta charset="UTF-8">
    <meta name="description" content="{{ metadata.description }}">
    <meta name="robots" content="index, follow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="n3rdium">

    <!-- TODO meta image -->

    <link rel=stylesheet href="/css/theme.css"/>
    <link rel=stylesheet href="/css/kami.css"/>
    <link rel=stylesheet href="/css/index.css"/>
    <link rel=stylesheet href="/css/blog-post.css"/>
    <link rel=stylesheet href="/css/astro.css"/>
    <script src="/js/nav.js"></script>
  </head>
  <body>
    <main role=main class="content">
        <div class="post-header">
            <a class="back-link" href="/astro/{{ metadata.year }}">&lt;- /astro/{{ metadata.year }}</a>
            <h1 class="title">{{ title }}</h1>
            <div class="description"> 
                {{ metadata.pubdate }} \\
                {% if "readtime" in metadata %}
                    ~{{ metadata.readtime }} read \\
                {% endif %}
                {{ metadata.description }}
            </div>
            <img class="astro-image" src="{{ metadata.image }}"></img>
            <div class="meta">
                <div class="tags">
                    {% for item in metadata.tags %}
                    <code>{{ item }}</code>
                    {% endfor %}
                </div>
            </div>
        </div>
        <br>
        {{ body }}
    </main>
  </body>
</html>
